name: Starter checks (manual draft)
on:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bloodconnect
          POSTGRES_USER: bloodconnect
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bloodconnect -d bloodconnect"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: postgresql
      POSTGRES_DB: bloodconnect
      POSTGRES_USER: bloodconnect
      POSTGRES_PASSWORD: test-only-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate ephemeral test signing key
        run: python -c "import secrets,os; open(os.environ['GITHUB_ENV'],'a').write('DJANGO_SECRET_KEY='+secrets.token_urlsafe(60)+'\n')"
      - run: python backend/manage.py migrate --noinput
      - run: sh scripts/check.sh
