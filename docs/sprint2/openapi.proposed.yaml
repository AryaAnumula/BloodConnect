openapi: 3.0.3
info:
  title: BloodConnect Sprint 2 DESIGN CONTRACT — NOT IMPLEMENTED
  version: 0.1.0-proposed
  description: Additive design proposal against main a46f81817d7ee26bff7b3ce6e423785a34f951c7.
    Does not replace Sprint 1 contract or mount routes. All S2 decision gates require
    real approval. Exact adopted stories retained separately. Internal notification
    transport has its own draft spec.
servers:
- url: http://localhost:8000
paths:
  /api/v1/blood-units:
    post:
      operationId: createBloodUnit
      summary: Create one unit from an eligible donor; server calculates expiry; collection_event_id
        must resolve to the approved collection-source design.
      tags:
      - inventory
      x-owner: Ch Yashwitha
      x-stories:
      - BB-13
      x-requirements:
      - FR-006
      - FR-007
      - SEC-002
      - SEC-003
      x-contract-status: PROPOSED_APPROVAL_REQUIRED
      x-implementation-status: not_implemented
      x-allowed-roles:
      - STAFF
      x-decision-gates:
      - S2-01
      - S2-02
      - S2-10
      description: 'Design contract only. No route is added by this pack. All superusers
        denied under proposed operational matrix. Missing/expired sessions keep existing
        DRF 403 authentication_required, not a new JWT/401 architecture. For owner-restricted
        records use identical 404 for other owner and missing record. Dates/times
        and validation follow conventions.md. Create one unit from an eligible donor;
        server calculates expiry; collection_event_id must resolve to the approved
        collection-source design. collection_event_id is optional: omission creates
        a collection event and first unit atomically; supplied ID must match donor/date
        and approved collection rules. No orphan foreign key or separate inaccessible
        creation prerequisite.'
      security:
      - sessionCookie: []
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Existing same-origin CSRF token; bootstrap via GET /api/v1/auth/csrf
        schema:
          type: string
          minLength: 1
      responses:
        '201':
          description: Successful real implementation response; not currently implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
        '400':
          description: Invalid fields/query/JSON; no partial write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: authentication_required or forbidden; no sensitive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing record or hidden other-owner record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict, capacity/duplicate/concurrent use or policy_unresolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ineligible donor, unsafe unit or invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Redacted storage/service unavailability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodUnitCreate'
    get:
      operationId: listBloodUnits
      summary: listBloodUnits
      tags:
      - inventory
      x-owner: Ch Yashwitha
      x-stories:
      - BB-13
      x-requirements:
      - FR-006
