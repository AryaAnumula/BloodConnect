{% extends 'base.html' %}{% load static %}{% block content %}<h1>Donor registration</h1><p>Complete this one-page form, then sign in with your new account.</p><ul id="registration-errors" role="alert"></ul><form id="registration-form"><label>Full name<input name="full_name" required maxlength="120" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Mobile in international format, for example +919876543210<input name="mobile" type="tel" required pattern="\+[1-9][0-9]{7,14}" title="International format, for example +919876543210" autocomplete="tel"></label><label>Password (at least 12 characters)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Blood group<select name="blood_group"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Location<input name="location" required maxlength="120"></label><button>Register</button></form>{% endblock %}{% block scripts %}<script type="module" src="{% static 'js/pages/registration.js' %}"></script>{% endblock %}
